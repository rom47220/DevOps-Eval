name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
      - name: flake8
        working-directory: app
        run: flake8 .

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - name: pytest
        working-directory: app
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            app/coverage.xml
            app/junit.xml
          if-no-files-found: error

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download a test report
        uses: actions/download-artifact@v4
        with:
          name: test-reports-py3.12
          path: reports
      - name: Check reports present
        run: |
          test -f reports/coverage.xml
          test -f reports/junit.xml
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: devops-eval:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=1.0.0

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint workflows
        run: yamllint .github/workflows .github/actions

  ci-ok:
    name: Ci-ok
    needs: [lint, test, build, yaml-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs green
        run: echo "CI OK"
