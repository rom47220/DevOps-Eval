name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/devops-eval
      APP_VERSION: "1.0.0"
    steps:
      - name: Resolve commit
        id: rev
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=${{ github.event.workflow_run.head_sha }}"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=${{ github.sha }}"
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}

      - name: Short SHA
        id: meta
        shell: powershell
        run: |
          $short = "${{ steps.rev.outputs.sha }}".Substring(0, 7)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "short=$short"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ steps.rev.outputs.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short }}
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}

      - name: Save previous tag for rollback
        id: previous
        shell: powershell
        working-directory: app
        run: |
          New-Item -ItemType Directory -Force -Path .deploy | Out-Null
          if (Test-Path .deploy/current_tag) {
            $tag = (Get-Content .deploy/current_tag -Raw).Trim()
            Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "tag="
          }

      - name: Deploy
        id: deploy
        shell: powershell
        working-directory: app
        env:
          GIT_SHA: ${{ steps.rev.outputs.sha }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          docker pull "${{ env.IMAGE }}:${{ steps.meta.outputs.short }}"
          docker tag "${{ env.IMAGE }}:${{ steps.meta.outputs.short }}" devops-eval:local
          docker compose up -d --no-build web redis
          & ../scripts/healthcheck.ps1 -Url http://localhost:8080/health -Retries 3 -SleepSecs 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${{ steps.meta.outputs.short }}" | Set-Content .deploy/current_tag

      - name: Rollback
        if: failure() && steps.deploy.outcome == 'failure'
        shell: powershell
        working-directory: app
        run: |
          $prev = "${{ steps.previous.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($prev)) {
            Write-Host "Rollback vers latest"
            docker pull "${{ env.IMAGE }}:latest"
            docker tag "${{ env.IMAGE }}:latest" devops-eval:local
          } else {
            Write-Host "Rollback vers $prev"
            docker pull "${{ env.IMAGE }}:${prev}"
            docker tag "${{ env.IMAGE }}:${prev}" devops-eval:local
          }
          docker compose up -d --no-build web redis
          exit 1
